<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="hero-title hero-description">
  <title id="hero-title">Leonardo Schmitt — animated QA Orbit interface</title>
  <desc id="hero-description">Leonardo Schmitt builds intelligent quality systems combining automation, AI, and software engineering around a subtly animated QA Orbit system.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1200" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.55" stop-color="#081126"/>
      <stop offset="1" stop-color="#070A1B"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="682" y1="130" x2="1058" y2="438" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="hero-cyan-field" cx="0" cy="0" r="1" gradientTransform="translate(891 277) rotate(90) scale(247 290)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-violet-field" cx="0" cy="0" r="1" gradientTransform="translate(1120 520) rotate(-135) scale(270 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hero-core-fill" cx="0" cy="0" r="1" gradientTransform="translate(866 252) rotate(52) scale(139)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#153B58"/>
      <stop offset="0.56" stop-color="#0D1B38"/>
      <stop offset="1" stop-color="#0A1024"/>
    </radialGradient>
    <pattern id="hero-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#3B82F6" stroke-opacity="0.08" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="#22D3EE" fill-opacity="0.12"/>
    </pattern>
    <clipPath id="hero-frame-clip">
      <rect x="1" y="1" width="1198" height="558" rx="23"/>
    </clipPath>
    <filter id="hero-soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="hero-background" clip-path="url(#hero-frame-clip)">
    <rect width="1200" height="560" fill="url(#hero-bg)"/>
    <rect width="1200" height="560" fill="url(#hero-grid)"/>
    <rect x="570" width="630" height="560" fill="url(#hero-cyan-field)"/>
    <rect x="760" y="260" width="440" height="300" fill="url(#hero-violet-field)"/>
    <path d="M40 108H252M40 452H180M1024 72H1160M1092 488H1160" stroke="#233455" stroke-width="1"/>
    <path d="M40 108V88M1160 72V92M40 452V472M1160 488V468" stroke="#22D3EE" stroke-opacity="0.45"/>
  </g>

  <rect x="1" y="1" width="1198" height="558" rx="23" fill="none" stroke="#233455" stroke-width="2"/>
  <path d="M26 72V26H72M1128 26H1174V72M1174 488V534H1128M72 534H26V488" fill="none" stroke="url(#hero-accent)" stroke-opacity="0.65" stroke-width="1.5"/>

  <g id="hero-copy">
    <g transform="translate(72 116)">
      <circle cx="5" cy="-4" r="4" fill="#2DD4BF"/>
      <path d="M18-4H50" stroke="#2DD4BF" stroke-opacity="0.55"/>
      <text x="62" y="0" fill="#B7C4D8" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="13" font-weight="650" letter-spacing="1.5">QA ENGINEER · AUTOMATION SPECIALIST</text>
    </g>

    <text x="68" y="190" fill="#F8FAFC" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="60" font-weight="750" letter-spacing="-0.5">LEONARDO</text>
    <text x="68" y="251" fill="url(#hero-accent)" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="60" font-weight="750" letter-spacing="-0.5">SCHMITT</text>

    <text x="72" y="314" fill="#F8FAFC" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="30" font-weight="600">Engineering <tspan fill="#22D3EE">quality</tspan> beyond testing.</text>

    <text x="72" y="360" fill="#B7C4D8" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="18" font-weight="500">
      <tspan x="72" dy="0">I build intelligent systems where automation, AI,</tspan>
      <tspan x="72" dy="29">and software engineering converge.</tspan>
    </text>

    <g id="hero-cta" transform="translate(72 427)">
      <rect width="220" height="48" rx="9" fill="#0E2438" stroke="#22D3EE" stroke-opacity="0.8"/>
      <path d="M20 24H38M32 18L38 24L32 30" fill="none" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="52" y="29" fill="#F8FAFC" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="13" font-weight="650" letter-spacing="0.8">EXPLORE QA ORBIT</text>
      <path class="hero-telemetry-line" d="M220 24H338" stroke="#22D3EE" stroke-opacity="0.3" stroke-dasharray="4 8"/>
      <circle class="hero-node" cx="338" cy="24" r="3.5" fill="#22D3EE" fill-opacity="0.8"/>
    </g>
  </g>

  <g id="hero-orbit-system">
    <g id="hero-orbit-external" transform="rotate(-8 888 280)" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="-8 888 280" to="352 888 280" dur="40s" repeatCount="indefinite"/>
      <ellipse cx="888" cy="280" rx="304" ry="220" stroke="#233455" stroke-width="1"/>
      <path d="M600 209C654 117 759 63 873 61" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1.5"/>
      <path class="hero-telemetry-line" d="M1037 409C1095 380 1138 337 1169 286" stroke="#8B5CF6" stroke-opacity="0.58" stroke-width="1.7" stroke-dasharray="8 10"/>
    </g>
    <g id="hero-orbit-inner" transform="rotate(7 888 280)" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="7 888 280" to="-353 888 280" dur="24s" repeatCount="indefinite"/>
      <ellipse cx="888" cy="280" rx="220" ry="154" stroke="#3B82F6" stroke-opacity="0.42" stroke-width="1.3" stroke-dasharray="3 9"/>
      <ellipse cx="888" cy="280" rx="128" ry="92" stroke="#22D3EE" stroke-opacity="0.42" stroke-width="1.3"/>
    </g>

    <g id="hero-telemetry" font-family="JetBrains Mono, Consolas, monospace" font-size="9" letter-spacing="1.2" fill="#94A3B8">
      <text x="619" y="106" opacity="0.62">ORBIT / 01</text>
      <path class="hero-telemetry-line" d="M619 116H682L709 143" fill="none" stroke="#3B82F6" stroke-opacity="0.4" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="10s" repeatCount="indefinite"/></path>
      <circle class="hero-node" cx="709" cy="143" r="3" fill="#22D3EE"/>
      <text x="1035" y="416" opacity="0.62">SYSTEM / ACTIVE</text>
      <path d="M1033 425H1114" stroke="#233455"/>
      <circle class="hero-node" cx="1123" cy="425" r="3.5" fill="#2DD4BF"/>
    </g>

    <g id="hero-core" transform="translate(888 280)">
      <circle id="hero-core-glow" r="86" fill="#22D3EE" fill-opacity="0.07" filter="url(#hero-soft-glow)"><animate attributeName="fill-opacity" values="0.05;0.11;0.05" dur="5s" repeatCount="indefinite"/><animate attributeName="r" values="85;88;85" dur="5s" repeatCount="indefinite"/></circle>
      <circle r="72" fill="url(#hero-core-fill)" stroke="#22D3EE" stroke-opacity="0.7" stroke-width="1.5"/>
      <circle r="62" fill="none" stroke="#3B82F6" stroke-opacity="0.22" stroke-dasharray="2 6"/>
      <path d="M-72 0H-56M56 0H72M0-72V-56M0 56V72" stroke="#22D3EE" stroke-opacity="0.8"/>
      <circle class="hero-node" cx="-16" cy="-29" r="3" fill="#22D3EE"/>
      <circle class="hero-node" cx="0" cy="-29" r="3" fill="#3B82F6"/>
      <circle class="hero-node" cx="16" cy="-29" r="3" fill="#8B5CF6"/>
      <text x="0" y="3" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="25" font-weight="750">QA ORBIT</text>
      <path d="M-30 21H30" stroke="#22D3EE" stroke-opacity="0.45"/>
    </g>
    <g id="hero-product-descriptor" font-family="Inter, Arial, Helvetica, system-ui, sans-serif">
      <rect x="786" y="358" width="204" height="30" rx="15" fill="#0B1226" stroke="#22D3EE" stroke-opacity="0.5"/>
      <text x="888" y="378" text-anchor="middle" fill="#C9F7FF" font-size="11.5" font-weight="700" letter-spacing="0.9">QUALITY INTELLIGENCE SYSTEM</text>
    </g>

    <g id="hero-module-automation">
      <animateMotion dur="36s" begin="-9s" repeatCount="indefinite" rotate="0" path="M1113 280 C1113 186 1012 110 888 110 C764 110 663 186 663 280 C663 374 764 450 888 450 C1012 450 1113 374 1113 280 Z"/>
      <g class="hero-module-float">
      <circle r="34" fill="#0B172B" stroke="#22D3EE" stroke-opacity="0.72"/>
      <path d="M-13-9L-3 0L-13 9M3-9L13 0L3 9" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-49" y="43" width="98" height="26" rx="13" fill="#0B1226" stroke="#233455"/>
      <text x="0" y="60" text-anchor="middle" fill="#5EEAD4" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.6">AUTOMATION</text>
      </g>
    </g>

    <g id="hero-module-ai">
      <animateMotion dur="36s" begin="-21s" repeatCount="indefinite" rotate="0" path="M1113 280 C1113 186 1012 110 888 110 C764 110 663 186 663 280 C663 374 764 450 888 450 C1012 450 1113 374 1113 280 Z"/>
      <g class="hero-module-float">
      <circle r="34" fill="#12132D" stroke="#8B5CF6" stroke-opacity="0.78"/>
      <path d="M-11-8L0-14L12-6L9 10L-5 14L-13 4Z" fill="none" stroke="#8B5CF6" stroke-width="1.2"/>
      <path d="M-11-8L9 10M0-14L-5 14M12-6L-13 4" stroke="#8B5CF6" stroke-opacity="0.7"/>
      <circle cx="-11" cy="-8" r="2.5" fill="#E6F1FF"/>
      <circle cx="12" cy="-6" r="2.5" fill="#E6F1FF"/>
      <circle cx="9" cy="10" r="2.5" fill="#E6F1FF"/>
      <circle cx="-5" cy="14" r="2.5" fill="#E6F1FF"/>
      <rect x="-30" y="43" width="60" height="26" rx="13" fill="#0B1226" stroke="#233455"/>
      <text x="0" y="60" text-anchor="middle" fill="#B7A4FF" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing="1">AI</text>
      </g>
    </g>

    <g id="hero-module-engineering">
      <animateMotion dur="36s" begin="-33s" repeatCount="indefinite" rotate="0" path="M1113 280 C1113 186 1012 110 888 110 C764 110 663 186 663 280 C663 374 764 450 888 450 C1012 450 1113 374 1113 280 Z"/>
      <g class="hero-module-float">
      <circle r="34" fill="#0C1830" stroke="#3B82F6" stroke-opacity="0.78"/>
      <path d="M-5-13L-17 0L-5 13M5-13L17 0L5 13" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-52" y="43" width="104" height="26" rx="13" fill="#0B1226" stroke="#233455"/>
      <text x="0" y="60" text-anchor="middle" fill="#7DB7FF" font-family="Inter, Arial, Helvetica, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.4">ENGINEERING</text>
      </g>
    </g>

    <g id="hero-orbit-nodes">
      <circle class="hero-node" cx="652" cy="161" r="5" fill="#050816" stroke="#22D3EE" stroke-width="1.5"/>
      <circle class="hero-node" cx="1144" cy="287" r="4.5" fill="#8B5CF6"/>
      <circle class="hero-node" cx="877" cy="498" r="4.5" fill="#3B82F6"/>
      <circle class="hero-node" cx="784" cy="172" r="3.5" fill="#22D3EE"/>
      <circle class="hero-node" cx="976" cy="334" r="3.5" fill="#8B5CF6"/>
    </g>
  </g>

  <g id="hero-frame-meta" font-family="JetBrains Mono, Consolas, monospace" font-size="8" letter-spacing="1.5" fill="#94A3B8" opacity="0.45">
    <text x="48" y="58">QAO / PROFILE INTERFACE</text>
  </g>
</svg>
