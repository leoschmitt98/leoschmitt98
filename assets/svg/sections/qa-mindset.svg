

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="qam-title qam-desc"><title id="qam-title">Quality is an engineering discipline</title><desc id="qam-desc">Section banner about Leonardo's technical approach to quality engineering.</desc><defs><linearGradient id="qam-bg" x1="0" x2="1"><stop stop-color="#050816"/><stop offset="1" stop-color="#11102A"/></linearGradient><linearGradient id="qam-line" x1="0" x2="1"><stop stop-color="#6D5DFB"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><rect width="1200" height="150" rx="18" fill="url(#qam-bg)"/><rect x="1" y="1" width="1198" height="148" rx="17" fill="none" stroke="#233455"/><text x="56" y="50" fill="#8B7CFF" font-family="Consolas,monospace" font-size="11" font-weight="600" letter-spacing="2">QUALITY ENGINEERING / 02</text><text x="56" y="94" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="700">Quality is an engineering discipline</text><text x="56" y="120" fill="#94A3B8" font-family="Segoe UI,Arial,sans-serif" font-size="14">Investigate deeply. Understand the system. Automate what deserves to scale.</text><g transform="translate(963 35)" fill="none" stroke="url(#qam-line)" stroke-width="2"><path d="M0 40h42l18-25 25 50 20-30h72" stroke-dasharray="220"><animate attributeName="stroke-dashoffset" values="220;0;0" keyTimes="0;.65;1" dur="8s" repeatCount="indefinite"/></path><circle cx="42" cy="40" r="5" fill="#6D5DFB"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></circle><circle cx="85" cy="65" r="5" fill="#22D3EE"><animate attributeName="opacity" values=".45;1;.45" dur="4s" begin="-1.3s" repeatCount="indefinite"/></circle><circle cx="105" cy="35" r="5" fill="#3B82F6"><animate attributeName="opacity" values=".45;1;.45" dur="4s" begin="-2.6s" repeatCount="indefinite"/></circle></g></svg>
